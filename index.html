<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유실물 e음</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 공공 누리집형 웹 서비스. 상단 머리 영역 + 1200px 본문, 모바일에서 한 줄로 쌓임 */
:root {
  --bg: #FFFFFF; --surface: #F4F5F6; --surface-2: #E6E8EA; --line: #CDD1D5; --line-strong: #58616A;
  --fg: #1E2124; --fg-2: #464C53; --fg-3: #6D7882;
  --primary: #256EF4; --primary-strong: #0B50D0; --primary-soft: #ECF2FE; --on-primary: #FFFFFF;
  --navy: #063A74; --on-navy: #FFFFFF; --line-2: #00A84D;
  --success-fg: #267337; --success-bg: #EAF6EC;
  --warning-fg: #8A5C00; --warning-bg: #FFF3DB;
  --error-fg: #BD2C0F; --error-bg: #FDEFEC;
  --info-fg: #096AB3; --info-bg: #E7F4FE;
  --shade: rgba(16, 20, 24, .55);
  --font: "Pretendard GOV", Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131416; --surface: #1E2124; --surface-2: #2B2F33; --line: #464C53; --line-strong: #B1B8BE;
    --fg: #F4F5F6; --fg-2: #CDD1D5; --fg-3: #B1B8BE;
    --primary: #4C87F6; --primary-strong: #86AFF9; --primary-soft: #0D2456; --on-primary: #03163A;
    --navy: #0D2456; --on-navy: #F4F5F6; --line-2: #3CC77A;
    --success-fg: #8FD19E; --success-bg: #12351C; --warning-fg: #F2C46B; --warning-bg: #3A2A05;
    --error-fg: #F5A08C; --error-bg: #3E1409; --info-fg: #8CC8F5; --info-bg: #072E4D;
    --shade: rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131416; --surface: #1E2124; --surface-2: #2B2F33; --line: #464C53; --line-strong: #B1B8BE;
  --fg: #F4F5F6; --fg-2: #CDD1D5; --fg-3: #B1B8BE;
  --primary: #4C87F6; --primary-strong: #86AFF9; --primary-soft: #0D2456; --on-primary: #03163A;
  --navy: #0D2456; --on-navy: #F4F5F6; --line-2: #3CC77A;
  --success-fg: #8FD19E; --success-bg: #12351C; --warning-fg: #F2C46B; --warning-bg: #3A2A05;
  --error-fg: #F5A08C; --error-bg: #3E1409; --info-fg: #8CC8F5; --info-bg: #072E4D;
  --shade: rgba(0, 0, 0, .7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scrollbar-gutter: stable; overflow-y: scroll; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; } body > main { flex: 1 0 auto; } body > footer { flex: none; } [hidden] { display: none !important; } img { max-width: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 17px; line-height: 1.5; }
body { word-break: keep-all; overflow-wrap: break-word; } /* #김다영 수정: 한국어 문장이 글자 중간에서 끊기지 않고 띄어쓰기 단위로 줄바꿈 */
.band { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.in { max-width: 1200px; margin: 0 auto; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
h1 { font-size: 40px; line-height: 1.4; } h2 { font-size: 32px; line-height: 1.4; } h3 { font-size: 24px; line-height: 1.5; }
h3.s { font-size: 19px; }
p { margin: 0; }
a { color: var(--primary-strong); }
.small { font-size: 15px; color: var(--fg-2); } .cap { font-size: 13px; color: var(--fg-3); }
button, input, textarea, select { font-family: inherit; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 머리 영역 */
.pilot { background: var(--surface); border-bottom: 1px solid var(--line); font-size: 15px; color: var(--fg-2); }
.pilot .in { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; justify-content: space-between; padding-block: 8px; }
.pilot b { color: var(--fg); }
.zoom { display: flex; gap: 4px; align-items: center; }
.zoom button { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: var(--r-sm); height: 32px; min-width: 36px; cursor: pointer; font-size: 15px; }
header.top { border-bottom: 1px solid var(--line); background: var(--bg); }
header.top .in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 16px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); }
.logo .mark { width: 40px; height: 40px; flex: none; }
.logo .nm { display: flex; flex-direction: column; line-height: 1.25; }
.logo .nm b { font-size: 22px; letter-spacing: -.01em; } .logo .nm span { font-size: 13px; color: var(--fg-3); }
nav.gnb { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
nav.gnb a { text-decoration: none; color: var(--fg); font-weight: 700; font-size: 17px; padding: 8px 12px; border-radius: var(--r-md); min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
nav.gnb a:hover { background: var(--surface); }
nav.gnb a[aria-current="page"] { color: var(--primary-strong); box-shadow: inset 0 -3px 0 var(--primary); border-radius: 0; }
nav.gnb a.staff { border: 1px solid var(--line-strong); }
nav.gnb a.staff svg { width: 18px; height: 18px; }
.subnav { background: var(--navy); color: var(--on-navy); }
.subnav .in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-block: 8px; font-size: 15px; }
.subnav nav { display: flex; gap: 4px; flex-wrap: wrap; }
.subnav a, .subnav button { color: var(--on-navy); text-decoration: none; font-weight: 700; padding: 6px 12px; border-radius: var(--r-md); min-height: 40px; display: inline-flex; align-items: center; background: transparent; border: 1px solid transparent; cursor: pointer; font-size: 15px; }
.subnav a[aria-current="page"] { background: var(--on-navy); color: var(--navy); }
.subnav button { border-color: currentColor; }
main { padding-block: 32px 64px; }
.crumb { font-size: 15px; color: var(--fg-3); display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.crumb a { color: var(--fg-3); }
.view { display: flex; flex-direction: column; gap: 32px; }
.panel { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; background: var(--bg); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel.soft { background: var(--surface); border-color: transparent; }
.head { display: flex; flex-direction: column; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* 버튼 */
.btn { font-size: 17px; font-weight: 700; border-radius: var(--r-md); padding: 0 20px; height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: 1px solid transparent; text-decoration: none; white-space: nowrap; }
.btn svg { flex: none; }
.btn.primary { background: var(--primary); color: var(--on-primary); } .btn.primary:hover { background: var(--primary-strong); }
.btn.secondary { background: var(--primary-soft); color: var(--primary-strong); border-color: var(--primary); }
.btn.tertiary { background: var(--bg); color: var(--fg); border-color: var(--line-strong); }
.btn.danger { background: var(--error-fg); color: var(--bg); }
.btn.sm { height: 40px; font-size: 15px; padding: 0 14px; }
.btn.lg { height: 56px; font-size: 19px; padding: 0 28px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns.center { justify-content: center; }
.btns.end { justify-content: flex-end; }

/* 입력 */
textarea, input[type="text"], input[type="email"], input[type="password"], input[type="time"], input[type="date"], input[type="search"], select { font-size: 17px; color: var(--fg); background: var(--bg); border: 1px solid var(--line-strong); border-radius: var(--r-md); padding: 12px 14px; min-height: 48px; width: 100%; }
textarea { resize: vertical; line-height: 1.6; min-height: 96px; }
textarea::placeholder, input::placeholder { color: var(--fg-3); }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.form .f { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.form .full { grid-column: 1 / -1; }
.form label, .lbl { font-size: 15px; font-weight: 700; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 2px; flex: none; }

/* 메인 */
.hero { background: var(--navy); color: var(--on-navy); border-radius: var(--r-xl); padding: 40px; display: flex; flex-direction: column; gap: 20px; }
.hero h1 { color: var(--on-navy); }
.hero .sub { font-size: 19px; opacity: .9; max-width: 60ch; text-wrap: pretty; } /* #고현 수정: 줄바꿈 — 마지막 줄에 몇 글자만 남지 않게 */
.search { background: var(--bg); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.search label { font-size: 15px; font-weight: 700; color: var(--fg); }
.search .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.quick a { text-decoration: none; color: var(--fg); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 8px; min-height: 140px; }
.quick a:hover { border-color: var(--primary); }
.quick .ic { width: 40px; height: 40px; border-radius: var(--r-md); background: var(--primary-soft); color: var(--primary-strong); display: grid; place-items: center; }
.quick b { font-size: 19px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; counter-reset: s; padding: 0; margin: 0; }
.steps li { list-style: none; border-top: 3px solid var(--primary); padding-top: 12px; display: flex; flex-direction: column; gap: 4px; }
.steps li b::before { counter-increment: s; content: counter(s) ". "; color: var(--primary-strong); }

/* 습득물 찾기 */
.aisearch { background: var(--navy); color: var(--on-navy); border-radius: var(--r-xl); padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.aisearch label { font-weight: 700; font-size: 17px; }
.aisearch .bar { display: flex; gap: 8px; }
.aisearch .bar input { flex: 1; min-width: 0; }
.aisearch .msg { font-size: 15px; opacity: .92; min-height: 22px; }
/* #김다영 수정 시작: 물건 탭 */
.itemtabs { display: flex; flex-direction: column; gap: 8px; }
.itemtabs .row { display: flex; flex-wrap: wrap; gap: 8px; }
.itemtabs button { border: 1px solid var(--line-strong); background: var(--bg); color: var(--fg); border-radius: 999px; min-height: 44px; padding: 0 18px; font-size: 17px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.itemtabs button .n { font-size: 13px; font-weight: 700; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.itemtabs button[aria-selected="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.itemtabs button[aria-selected="true"] .n { color: var(--on-primary); opacity: .85; }
/* #김다영 수정 끝 */
.filters { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 16px; background: var(--surface); }
.filters .top { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.fgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.fgrid .f { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fgrid .feat { grid-column: span 2; }
.fgrid label { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.ai-tag { font-size: 11px; font-weight: 700; color: var(--on-primary); background: var(--primary); padding: 1px 6px; border-radius: var(--r-sm); letter-spacing: .04em; }
.fgrid .ai select, .fgrid .ai input { border-color: var(--primary); background: var(--primary-soft); }
.tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; color: var(--fg-2); font-size: 17px; font-weight: 700; padding: 10px 16px; cursor: pointer; min-height: 48px; border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--primary-strong); border-bottom-color: var(--primary); }
.listhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; }
.list { display: flex; flex-direction: column; gap: 12px; }
.card { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 16px; align-items: center; border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; background: var(--bg); cursor: pointer; text-align: left; color: var(--fg); font-size: 17px; width: 100%; }
.card:hover { border-color: var(--primary); }
.card.top { border: 2px solid var(--primary); }
.thumb { width: 112px; height: 112px; border-radius: var(--r-md); display: grid; place-items: center; color: var(--fg-3); background: var(--surface-2); overflow: hidden; }
.thumb svg { width: 56px; height: 56px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.cbody { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cname { font-size: 19px; font-weight: 700; }
.reason { font-size: 15px; color: var(--fg-2); }
.score { font-size: 13px; color: var(--fg-3); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: var(--r-sm); width: fit-content; white-space: nowrap; }
.badge svg { width: 14px; height: 14px; }
.b-high { background: var(--primary); color: var(--on-primary); }
.b-mid { background: var(--primary-soft); color: var(--primary-strong); }
.b-low { background: var(--surface-2); color: var(--fg-2); }
.s-keep { background: var(--info-bg); color: var(--info-fg); }
.s-soon { background: var(--warning-bg); color: var(--warning-fg); }
.s-moved { background: var(--surface-2); color: var(--fg); }
.s-done { background: var(--success-bg); color: var(--success-fg); }
.s-val { background: var(--error-bg); color: var(--error-fg); border: 1px solid currentColor; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.empty { text-align: center; padding: 40px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* 알림 */
.alert { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding: 14px 16px; border-radius: var(--r-lg); border: 1px solid currentColor; }
.alert svg { width: 22px; height: 22px; }
.alert > div > b { display: block; } /* #고현 수정: 알림 제목만 줄바꿈. 본문 안의 굵은 글씨가 제멋대로 줄을 바꾸던 것 */
.alert p { color: var(--fg); font-size: 15px; }
.a-info { background: var(--info-bg); color: var(--info-fg); }
.a-warn { background: var(--warning-bg); color: var(--warning-fg); }
.a-error { background: var(--error-bg); color: var(--error-fg); }
.a-ok { background: var(--success-bg); color: var(--success-fg); }

/* 상세 */
.detail { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; align-items: start; }
/* #고현 수정: 상세 사진 — 4:3 칸에 맞추느라 세로 사진이 잘리던 것. 칸이 사진 모양을 따라가게 바꿈 */
.photo { max-width: 100%; max-height: 520px; min-height: 220px; border-radius: var(--r-lg); background: var(--surface-2); display: grid; place-items: center; color: var(--fg-3); overflow: hidden; }
.photo svg { width: 120px; height: 120px; }
.photo img { width: auto; height: auto; max-width: 100%; max-height: 520px; object-fit: contain; } /* #고현 수정: 상세 사진 — 사진 원래 비율 그대로, 어떤 경우에도 잘리지 않음 */
.scroll { overflow-x: auto; }
table.info { width: 100%; border-collapse: collapse; font-size: 17px; }
table.info th, table.info td { padding: 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
table.info th { width: 128px; background: var(--surface); color: var(--fg-2); font-weight: 700; font-size: 15px; }
.orgline { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.orgline .tel { font-weight: 700; font-variant-numeric: tabular-nums; }
.howto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 0; margin: 0; counter-reset: h; }
.howto li { list-style: none; background: var(--surface); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.howto li b::before { counter-increment: h; content: counter(h) ". "; color: var(--primary-strong); }
.bottom-actions { border-top: 1px solid var(--line); padding-top: 24px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.bottom-actions .proxy { width: 100%; max-width: 720px; }
.copyline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.num { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.toast { font-size: 15px; color: var(--success-fg); }

/* 당일 분실 */
.today { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; align-items: start; }
.modetabs { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 4px; gap: 4px; width: fit-content; }
.modetabs button { border: 0; background: transparent; color: var(--fg); font-size: 17px; font-weight: 700; height: 44px; padding: 0 20px; border-radius: var(--r-md); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.modetabs button[aria-selected="true"] { background: var(--primary); color: var(--on-primary); }
.dirs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.dirs label { border: 1px solid var(--line-strong); border-radius: var(--r-md); min-height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 12px; cursor: pointer; font-size: 15px; }
.dirs label:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); font-weight: 700; }
.dirs input { width: 18px; height: 18px; }

/* 열차·버스 위치 화면 (차내 노선 안내 화면 모양) */
.screen { background: #0E1A2B; color: #F4F6F8; border-radius: var(--r-lg); padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.screen .hd { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: center; font-size: 15px; }
.screen .hd b { font-size: 17px; }
.screen .lineno.pill { width: auto; min-width: 28px; padding: 0 10px; border-radius: 999px; font-size: 13px; white-space: nowrap; } /* #김다영 수정: 이름 노선은 알약 모양 */
.fhelp { display: block; margin-top: 16px; padding: 16px 18px; border-radius: var(--r-lg, 12px); background: var(--surface, #F4F6F8); font-size: 16px; line-height: 1.6; } /* #김다영 수정: 글씨 키움 */ /* #김다영 수정: 기능 설명 */
.fhelp > b, .fhelp > p { display: block; }
.fhelp li { margin: 0; padding: 0; }
.fhelp li > b { display: block; margin-bottom: 2px; } /* 제목 한 줄, 설명은 다음 줄 */
.fhelp .cap { font-size: 14px; }
/* #김다영 수정: 두 칸으로 나란한 화면(당일 분실·알림)은 박스 아래 끝을 맞춤 */

.fhelp ol { margin: 10px 0; padding-left: 0; display: grid; gap: 12px; list-style: none; }
.fhelp .cap { margin: 0; }
.empty-guide { padding: 28px 16px; text-align: center; border: 1px dashed var(--line, #D5DBE3); border-radius: var(--r-lg, 12px); } /* #김다영 수정: 고르기 전 안내 */
.empty-guide p { margin: 6px 0 0; }
.screen .lineno { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--line-c, #00A84D); color: #fff; font-weight: 700; font-size: 15px; margin-right: 8px; }
.screen .clock { font-variant-numeric: tabular-nums; color: #B7C2CF; }
.track-wrap { overflow-x: auto; padding-bottom: 4px; }
/* #서유석 수정 (5차): 역 7개만 보여 주고 스크롤바를 얇게 */
.track-wrap { scrollbar-width: thin; scrollbar-color: #50606F transparent; }
.track-wrap::-webkit-scrollbar { height: 6px; }
.track-wrap::-webkit-scrollbar-thumb { background: #50606F; border-radius: 3px; }
.track-wrap::-webkit-scrollbar-track { background: transparent; }
.track .st span { overflow-wrap: anywhere; }
.track { position: relative; min-width: 520px; height: 150px; margin: 0 40px; }
.track .rail { position: absolute; left: 0; right: 0; top: 70px; height: 8px; border-radius: 4px; background: var(--line-c, #00A84D); }
.track .rail.done { right: auto; background: #50606F; }
.track .st { position: absolute; top: 64px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; width: 80px; }
.track .st i { width: 20px; height: 20px; border-radius: 50%; background: #0E1A2B; border: 4px solid var(--line-c, #00A84D); }
.track .st span { font-size: 13px; color: #D5DDE5; text-align: center; line-height: 1.25; word-break: keep-all; }
.track .st.me i { border-color: #FFC83D; background: #FFC83D; }
.track .st.me span { color: #FFC83D; font-weight: 700; }
.track .veh { position: absolute; top: 4px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; transition: left .6s ease; }
.track .veh .pill { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #2B3A4D; color: #F4F6F8; white-space: nowrap; font-variant-numeric: tabular-nums; }
.track .veh.best .pill { background: #FFC83D; color: #2A1E00; }
.track .veh svg { width: 44px; height: 26px; }
/* #서유석 수정 (6차): 그림 양 끝의 열차·버스는 이름표를 안쪽으로 펼쳐 잘리지 않게 */
.track .veh.r { align-items: flex-end; transform: translateX(calc(-100% + 22px)); }
.track .veh.l { align-items: flex-start; transform: translateX(-22px); }
.screen .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: #B7C2CF; }
.screen .legend span { display: inline-flex; gap: 6px; align-items: center; }
.screen .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.cands { display: flex; flex-direction: column; gap: 8px; }
.cand { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--r-md); padding: 12px 16px; }
.cand.best { background: var(--primary-soft); }
.cand .no { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
dl.facts { display: grid; grid-template-columns: 120px minmax(0, 1fr); margin: 0; border-top: 1px solid var(--line); }
dl.facts dt, dl.facts dd { margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 15px; }
dl.facts dt { background: var(--surface); color: var(--fg-2); font-weight: 700; }
dl.facts dd { font-weight: 500; }

/* 알림 추적 */
.track2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.saved { display: flex; flex-direction: column; gap: 10px; }
.saved .it { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.saved .row { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.prog { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.prog span { height: 6px; border-radius: 3px; background: var(--surface-2); }
.prog span.on { background: var(--primary); }
.progl { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; font-size: 13px; color: var(--fg-3); }

/* 보관 기관 */
.orggrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
table.queue { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 620px; }
table.queue th, table.queue td { padding: 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
table.queue th { background: var(--surface); white-space: nowrap; }
table.queue td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 직원 */
.login { max-width: 480px; margin: 0 auto; width: 100%; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpi { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; background: var(--bg); text-align: left; color: var(--fg); font-size: 15px; cursor: pointer; }
.kpi .v { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
.kpi.val .v { color: var(--error-fg); }
.kpi[aria-pressed="true"] { border: 2px solid var(--primary); }
.stepper { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; padding: 0; margin: 0; }
.stepper li { list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 8px; border-bottom: 4px solid var(--surface-2); color: var(--fg-3); font-weight: 700; font-size: 15px; }
.stepper li .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--fg-2); flex: none; font-variant-numeric: tabular-nums; }
.stepper li.done { color: var(--fg-2); border-bottom-color: var(--primary-soft); }
.stepper li.done .n { background: var(--primary-soft); color: var(--primary-strong); }

.reg { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 24px; align-items: start; }
.cmp { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; align-items: start; }
.srcbox { background: var(--surface); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.srcbox .memo { white-space: pre-wrap; font-size: 17px; line-height: 1.6; }
.aibox { border: 2px solid var(--primary); border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.aibox .t { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.drop { border: 2px dashed var(--line-strong); border-radius: var(--r-lg); padding: 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.drop img { width: 96px; height: 96px; object-fit: cover; border-radius: var(--r-md); }
.drop .ph { width: 96px; height: 96px; border-radius: var(--r-md); background: var(--surface-2); display: grid; place-items: center; color: var(--fg-3); font-size: 13px; text-align: center; }
.script { background: var(--surface); border-radius: var(--r-md); padding: 16px; font-size: 17px; line-height: 1.6; white-space: pre-wrap; }
.guide-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.guide-tabs button { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; height: 36px; padding: 0 14px; font-size: 15px; cursor: pointer; }
.guide-tabs button[aria-selected="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.tmpl { display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.tmpl .fmt { font-weight: 700; background: var(--surface); border-radius: var(--r-md); padding: 10px 12px; }
.tmpl ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; color: var(--fg-2); }
.tmpl .exm { border-left: 3px solid var(--primary); padding: 4px 0 4px 12px; }
.memo-block { display: flex; flex-direction: column; gap: 8px; }
.memo-box { border: 1px solid var(--line-strong); border-radius: var(--r-md); overflow: hidden; background: var(--bg); }
.memo-box:focus-within { outline: 3px solid var(--primary); outline-offset: 2px; }
.memo-guide { background: var(--surface); border-bottom: 1px dashed var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.memo-guide .mg-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.memo-guide .mg-top .fmt { font-weight: 700; }
.memo-guide .mg-ex { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; color: var(--fg-2); }
.memo-guide .mg-ex span { flex: 1 1 260px; min-width: 0; }
/* #고현 수정: 메모 안내 — 안내 전체를 접이식으로 바꿔 메모 칸을 넓힘 */
.memo-guide > summary { cursor: pointer; color: var(--fg-2); font-size: 14px; font-weight: 500; }
.memo-guide:not([open]) { padding: 10px 14px; }
.memo-guide:not([open]) > summary { color: var(--fg-3); }
.memo-guide .mg-points { margin: 2px 0 0; padding-left: 20px; color: var(--fg-2); display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.memo-box textarea { border: 0; border-radius: 0; min-height: 120px; }
.memo-box textarea:focus-visible { outline: none; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.toolbar .grow { flex: 1 1 220px; min-width: 0; }
.toolbar select { width: auto; min-width: 140px; }
.scard { cursor: default; grid-template-columns: 112px minmax(0, 1fr) auto; }
.scard:hover { border-color: var(--line); }
.scard .inner { font-size: 15px; color: var(--fg-2); background: var(--surface); border-radius: var(--r-sm); padding: 4px 8px; width: fit-content; max-width: 100%; }
.scard.val { border: 2px solid var(--error-fg); }
.scard.val .cname { color: var(--error-fg); font-weight: 700; }
.scard.done { opacity: .7; }
.sacts { display: flex; flex-direction: column; gap: 8px; }
.tabs button.tab-val { color: var(--error-fg); }
.tabs button.tab-val[aria-selected="true"] { border-bottom-color: var(--error-fg); color: var(--error-fg); }
.val-text { color: var(--error-fg); }
tr.val td { background: var(--error-bg); }
tr.val .iname { color: var(--error-fg); font-weight: 700; }
tr.done td { color: var(--fg-3); }
.iname { font-weight: 500; }
.acts { display: flex; gap: 6px; flex-wrap: nowrap; }

/* 팝업 */
.modal { position: fixed; inset: 0; background: var(--shade); display: grid; place-items: center; z-index: 50; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal .box { background: var(--bg); color: var(--fg); border-radius: var(--r-xl); width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.modal .box.val { border-top: 8px solid var(--error-fg); }
.modal .mh { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.modal .x { border: 0; background: transparent; color: var(--fg-2); font-size: 24px; width: 40px; height: 40px; cursor: pointer; border-radius: var(--r-md); flex: none; }
.valnote { background: var(--error-bg); color: var(--error-fg); border-radius: var(--r-md); padding: 12px 14px; font-weight: 700; font-size: 15px; }
.checklist { display: flex; flex-direction: column; gap: 10px; }
.checklist .check.strong span { color: var(--error-fg); font-weight: 700; }

footer { border-top: 1px solid var(--line); background: var(--surface); }
footer .in { padding-block: 24px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--fg-3); }

@media (max-width: 1023px) {

}

  .hero { padding: 24px 20px; } .hero .sub { font-size: 17px; } .wide-only { display: none; } /* #고현 수정: 줄바꿈 — 좁은 화면에서는 강제 줄바꿈 해제 */

  .thumb { width: 80px; height: 80px; }
  .form, .fgrid { grid-template-columns: minmax(0, 1fr); }

  main { padding-block: 20px 48px; }

@media (max-width: 420px) { .quick { grid-template-columns: minmax(0, 1fr); } .quick a { min-height: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
/* #서유석 수정 시작 */
.stop { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line, #e5e5e5); font-size: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line, #ccc); flex: none; }
.dot.bus { background: #FFC83D; box-shadow: 0 0 0 3px rgba(255,200,61,.35); }
.tag { margin-left: auto; font-size: 12px; color: var(--ink-3, #666); }
.bus-tag { background: #FFC83D; color: #111; border-radius: 6px; padding: 1px 6px; font-size: 12px; margin-left: 4px; }
/* #서유석 수정 끝 */
.pager { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; margin-top: 16px; } /* #김다영 수정: 쪽 번호 */
.pager .btn { min-width: 40px; }
.scard .sacts .del { color: var(--error-fg); } /* #김다영 수정: 삭제 버튼 */
.delbox { display: flex; gap: 12px; align-items: center; margin: 12px 0; }
.delbox .thumb { width: 64px; height: 64px; flex: none; border-radius: 8px; overflow: hidden; background: var(--surface-2); display: grid; place-items: center; }
.delbox .thumb img, .delbox .thumb svg { width: 100%; height: 100%; object-fit: cover; }
.regphoto { display: block; max-width: 320px; max-height: 320px; width: auto; height: auto; object-fit: contain; border-radius: 12px; border: 1px solid var(--line, #D5DBE3); margin: 6px 0 16px; } /* #김다영 수정: 3단계 사진 */
/* #김다영 수정: 두 칸으로 나란한 화면(당일 분실·알림)은 박스 아래 끝을 맞춤 (앞의 align-items: start 보다 뒤에 둠) */
.today, .track2 { align-items: stretch; }
.today > .col > section.panel:last-of-type, .track2 > .col > section.panel:last-of-type { flex: 1 0 auto; }
/* #김다영 수정: 줄이 끝에 한두 단어만 남지 않게 문단 줄바꿈을 고르게 */
p, .small, .cap, li { text-wrap: pretty; }
h1, h2, h3, .empty-guide b { text-wrap: balance; }
/* #김다영 수정: 수령 신청 */
.reqstep { margin: 14px 0; padding: 14px 16px; border: 1px solid var(--line, #D5DBE3); border-radius: var(--r-lg, 12px); display: grid; gap: 10px; }

.nbadge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #E5484D; color: #fff; font-size: 12px; font-weight: 700; margin-left: 4px; }
#nbar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; display: flex; gap: 14px; align-items: center; padding: 12px 18px; border-radius: 12px; background: #1F2937; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.2); }

.track2 > form.panel { display: flex; flex-direction: column; justify-content: space-between; } /* #김다영 수정: 알림 조건 박스가 길어져도 아래만 비지 않게 고르게 */

.alert.inline > div { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 14px; } /* #김다영 수정: 제목 옆에 간격 두고 한 줄로 */

/* #김다영 수정: 글자 크기 통일 — 당일 분실 '기능 설명'(본문 16px·보조 14px)을 기준으로 */

.pchip { font-size: 14px; padding: 4px 10px; border-radius: 8px; background: var(--surface, #F4F6F8); }

/* #김다영 수정: 작성 요령 줄 간격 — 분류 버튼과 '작성 순서' 사이를 띄우고 줄마다 숨 쉴 틈 */

.memo-guide .mg-top, .memo-guide .mg-ex { margin-bottom: 10px; }
.memo-guide .mg-points { gap: 4px; margin-top: 4px; }
/* #김다영 수정: 받은 알림 예시 — 차례로 나타나기 + 알림이 오는 과정 애니메이션 */
.demo-alerts { display: flex; flex-direction: column; }

.demo-alerts > .alert:nth-of-type(3) { animation-delay: .3s; }

.aflow { margin-top: auto; padding-top: 20px; }
.aflow h4 { margin: 0 0 12px; }

  // 대조는 코드가 함 (판정은 코드, 설명은 사람). 두 글에 함께 나오는 낱말을 찾아 줌

  // ===== #고현 수정 시작: 담는 물건 우선 — "노트북이 든 백팩"이 전자기기로 분류되던 것 바로잡음 (서버 ai-parse 와 같은 기준) =====

  // 시청(1·2호선) 계정으로 "30번 버스" 물건이 등록되던 것을 막기 위함

  /* ---------- 문장 → 조건 (규칙 기반. 백엔드 연결 시 생성형 AI 결과로 대체) ---------- */
  function parse(text) {

  /* 정렬 점수 = 0.45 유사도 + 0.20 색상 + 0.15 날짜 + 0.10 노선 + 0.10 분류 (계획서 붙임 1) */

  function storage(it) {

  function opt(list, cur, all, labels) { return '<option value="">' + all + '</option>' + list.map(function (v) { return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc((labels && labels[v]) || v) + '</option>'; }).join(''); } // #김다영 수정: labels로 보이는 이름만 바꿀 수 있게 (값은 그대로)

  function rankItems(base, c) {
    if (!hasCond(c)) return base.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).map(function (it) { return { it: it, s: null }; });

      .sort(function (a, b) { return b.s - a.s; });
  }

  function fieldCls(x, k) { return x.aiKeys[k] ? 'f ai' : 'f'; }

  // ===== #고현 수정 시작: 노선 번호순 정렬 규칙 — 노선 선택 상자(filtersHtml)와 검색 실행부(runAi)가 같이 씀 =====
  // #고현 수정: filtersHtml 안에 있던 정렬 규칙을 함수로 뺌(규칙·주석은 그대로). 1~9호선 번호순, 그 밖(버스 등)은 원래 순서
  function lineOrder(a, b) {
    var an = a.match(/^(\d+)\s*호선$/);
    var bn = b.match(/^(\d+)\s*호선$/);

    if (an && bn) {
      return Number(an[1]) - Number(bn[1]);
    } // #고현 수정: 기존 1~9호선을 번호순으로 표시

    if (an) return -1; // #고현 수정: 숫자 호선을 다른 항목보다 먼저 표시
    if (bn) return 1;  // #고현 수정: 숫자 호선을 다른 항목보다 먼저 표시

    return 0; // #고현 수정: 그 밖의 항목은 기존 순서 유지
  }
  // ===== #고현 수정 끝 =====

        '<div class="' + fieldCls(x, 'date') + '"><label for="c-date">' + dateLabel + aiTag(x, 'date') + '</label><input id="c-date" type="date" data-k="date" value="' + esc(c.date) + '" max="' + TODAY + '"></div>' +

  // #김다영 수정 시작: 쪽 번호 (현재 쪽 앞뒤 2쪽 + 처음·끝)
  function pagerHtml(cur, total) {
    if (total <= 1) return '';
    var btn = function (n, label, aria) {
      return '<button type="button" class="btn ' + (n === cur && !aria ? 'primary' : 'secondary') + ' sm" data-pg="' + n + '"' + (n === cur && !aria ? ' aria-current="page"' : '') + (aria ? ' aria-label="' + aria + '"' : '') + '>' + label + '</button>';
    };
    var out = [], from = Math.max(1, cur - 2), to = Math.min(total, cur + 2);
    if (cur > 1) out.push(btn(cur - 1, '‹', '이전 쪽'));
    if (from > 1) { out.push(btn(1, '1')); if (from > 2) out.push('<span class="cap">…</span>'); }
    for (var n = from; n <= to; n++) out.push(btn(n, String(n)));
    if (to < total) { if (to < total - 1) out.push('<span class="cap">…</span>'); out.push(btn(total, String(total))); }
    if (cur < total) out.push(btn(cur + 1, '›', '다음 쪽'));
    return '<nav class="pager" aria-label="목록 쪽 번호">' + out.join('') + '</nav>';
  }
  // #김다영 수정 끝

    var PER_PAGE = 10, pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
    var sig = state.tab + '|' + JSON.stringify(c);
    if (state.pageSig !== sig) { state.pageSig = sig; state.page = 1; }
    state.page = Math.min(Math.max(1, state.page || 1), pages);
    var shown = list.slice((state.page - 1) * PER_PAGE, state.page * PER_PAGE);

    var cards = shown.map(function (r) { // #김다영 수정: 현재 쪽의 10개만
      var st = storage(r.it), rank = all.indexOf(r) + 1, top = scored && rank === 1;
      var lvl = !scored ? null : r.s >= 0.85 ? ['b-high', '닮음 높음'] : r.s >= 0.6 ? ['b-mid', '닮음 보통'] : ['b-low', '닮음 낮음'];

        '<span class="cname">' + esc(r.it.name) + ' (' + esc(r.it.color) + ')</span>' +

    return '<nav class="crumb" aria-label="현재 위치"><a href="#home">홈</a><span>›</span><span>습득물 찾기</span></nav>' +
      '<div class="view"><div class="head"><h2>습득물 찾기</h2><p class="small">지하철, 버스, 경찰서에 보관 중인 습득물을 한 번에 찾아요. 문장으로 설명하거나, 아래 조건을 직접 골라 보세요.</p></div>' +
      aiSearchHtml(state, '예: 어제 2호선 강남역에서 검은 가죽 반지갑을 두고 내렸어요', '문장을 입력하면 AI가 분류, 색상, 날짜, 노선을 찾아 아래 조건에 채워요.') +

        '<div class="listhead"><h3 class="s">' + (scored ? '조건과 닮은 습득물 ' + all.length + '건' : '전체 습득물 ' + all.length + '건') + '</h3><span class="cap">' + (scored ? '닮은 순 정렬 · AI가 고른 후보이며, 내 물건인지는 보관 기관에서 확인해요' : '최근 습득 순 정렬') + '</span></div>' +

    // ===== #고현 수정 시작: 공개 특징 다듬기 — 경찰청 문장이 그대로 들어와 검색어로 쓰기 나빠서 =====
    // "여권지갑(퓨시아(자홍)색)을 습득하여 보관하고 있습니다." → "여권지갑(퓨시아(자홍)색)"

  /* ================= 라우팅 ================= */
  var VIEWS = { home: vHome, find: vFind, detail: vDetail, today: vToday, track: vTrack, guide: vGuide, 'staff-login': vLogin, staff: vStaff, 'staff-items': vStaffItems, 'staff-req': vStaffReq }; // #김다영 수정: 수령 신청 페이지
  var phTimer = null;
  // ===== #김다영 수정 시작: 안내 문단에서 문장이 끝나는 곳("~요. ", "~다. ")마다 줄을 바꿈 =====
  // 글자만 건드리고(태그·속성은 그대로), 표·카드·입력칸 안은 건드리지 않음
  var SB_SEL = '.head > p, .alert p, .empty-guide p, .fhelp li, .fhelp > p, section.panel > p.small, section.panel > p.cap, .proxy p.small, form.panel > p.small';
  function sentenceBreaks(root) {
    root.querySelectorAll(SB_SEL).forEach(function (el) {
      var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [], n;
      while ((n = w.nextNode())) if (/[요다죠][.!?]\s+[^\s·]/.test(n.nodeValue)) nodes.push(n);
      nodes.forEach(function (t) {
        var parts = t.nodeValue.split(/([요다죠][.!?])\s+(?=[^\s·])/), frag = document.createDocumentFragment();
        for (var i = 0; i < parts.length; i += 2) {
          frag.appendChild(document.createTextNode(parts[i] + (parts[i + 1] || '')));
          if (i + 2 < parts.length) frag.appendChild(document.createElement('br'));
        }
        t.parentNode.replaceChild(frag, t);
      });
    });
  }

  function runAi(text, x, after) {
    x.query = text;
    var btn = document.getElementById('b-ai'), msg = document.getElementById('ai-msg');
    if (btn) btn.disabled = true; if (msg) msg.textContent = 'AI가 문장에서 조건을 찾고 있어요…';
    return DB.ai(text, 'search').then(function (r) {
      var c = r.out; // #고현 수정: 날짜를 못 찾으면 "어제"를 자동으로 넣던 기능 제거
      // ===== #김다영 수정 시작: 물건이 여러 개면 물건마다 조건을 따로 만듦 =====
      if (!c.lines) c.lines = c.line ? [c.line] : [];
      c.line = normLine(c.line); c.lines = c.lines.map(normLine).filter(function (l, i, a) { return l && a.indexOf(l) === i; }); // #김다영 수정: 버스 번호 → '버스'
      var keysOf = function (k) { var a = {}; ['cat', 'color', 'date', 'line', 'station'].forEach(function (n) { if (k[n]) a[n] = 1; }); if (k.feats.length) a.feats = 1; return a; };
      var list = (c.items || []).length >= 2 ? c.items : null;
      x.multi = list ? list.map(function (o) {
        var k = { cat: o.cat, color: o.color, feats: o.feats.slice(), date: c.date, line: c.line, lines: c.lines.slice(), station: c.station };
        return { conds: k, aiKeys: keysOf(k) };
      }) : null;
      x.mi = 0;
      if (x.multi) { x.conds = x.multi[0].conds; x.aiKeys = x.multi[0].aiKeys; }
      else { delete c.items; x.conds = c; x.aiKeys = keysOf(c); }
      var found = Object.keys(x.aiKeys).length;
      x.aiMsg = x.multi ? 'AI가 물건 ' + x.multi.length + '개를 찾았어요. 아래에서 물건을 골라 하나씩 확인하세요.' :
        found ? 'AI가 조건 ' + found + '개를 찾아 아래에 채웠어요. 틀린 조건은 바로 고치세요.' : '조건을 찾지 못했어요. 물건 종류나 색상을 넣어 다시 적어 보세요.';
      // ===== #김다영 수정 끝 =====
      // ===== #고현 수정 시작: ① AI 대신 규칙으로 찾았으면 안내 한 줄 ② 노선 목록 번호순 정렬 =====
      if (r.by === 'rule') x.aiMsg += ' (지금은 AI 대신 기본 규칙으로 찾았어요)'; // #고현 수정: 김다영 님 메시지 줄은 그대로 두고 뒤에만 붙임
      // #고현 수정: 노선 목록을 번호순(lineOrder)으로 정렬 — 김다영 님 '노선 N개' 안내문 줄은 그대로 두고 순서만 맞춤
      //   노선은 '하나만 맞아도' 찾으므로 순서가 바뀌어도 검색 결과는 같음. 물건이 여러 개면 물건마다 정렬
      (x.multi ? x.multi.map(function (m) { return m.conds; }) : [x.conds]).forEach(function (k) { if (k.lines) k.lines.sort(lineOrder); });
      // ===== #고현 수정 끝 =====

  function bind(h) {

      // ===== #고현 수정 시작: 예시 타이핑 효과 — 예시가 한 글자씩 써지고 지워지게 =====
      // #고현 수정: 예시 타이핑 효과 — 글자가 써지는 것으로 바뀌는 게 보여서 아래 점 표시는 없앰
      var q = document.getElementById('q'), pi = 0;

        var full = EXAMPLES[pi];
